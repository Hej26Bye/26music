<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#111019">
<title>26music — Music Library</title>
<style>
  :root{color-scheme:dark;--bg:#111019;--sidebar:#181622;--line:#ffffff17;--text:#faf8ff;--muted:#b0aac1;--accent:#cbbaff;--bar:#1d1a29;font:16px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--text);--player-height:100px;--collection-width:clamp(316px,29vw,430px);--panel-gap:16px;--panel-motion:280ms cubic-bezier(.22,.8,.24,1)}
  button,input{font:inherit;color:inherit}
  button{cursor:pointer;border:0;background:none}
  button:disabled{cursor:default;opacity:.35}
  button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
  [hidden]{display:none!important}
  .shell{display:grid;grid-template-columns:clamp(174px,16vw,224px) minmax(0,1fr) 0px;min-height:100dvh;padding-bottom:calc(var(--player-height) + 14px);transition:grid-template-columns var(--panel-motion)}
  .collection-open .shell{grid-template-columns:clamp(174px,16vw,224px) minmax(0,1fr) calc(var(--collection-width) + var(--panel-gap))}
  .sidebar{background:var(--sidebar);border-right:1px solid var(--line);padding:32px 18px}
  .side-inner{position:sticky;top:32px}
  .brand{display:flex;align-items:center;gap:11px;padding:0 8px;margin-bottom:42px;font-weight:740;font-size:23px;letter-spacing:-1px}
  .mark{display:grid;place-items:center;width:35px;height:35px;border-radius:11px;background:#cbbaff;color:#201534}
  .icon{width:20px;height:20px;display:inline-block;vertical-align:middle;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
  .nav-label{padding:0 10px;margin:0 0 8px;color:var(--muted);font-size:12px;font-weight:650}
  .nav-btn{display:flex;align-items:center;gap:11px;text-align:left;color:var(--muted);width:100%;padding:10px 11px;border-radius:9px}
  .nav-btn[aria-current="page"]{background:#cbbaff1d;color:var(--accent);font-weight:650}
  .nav-btn:hover,.icon-btn:hover:enabled,.track:hover{background:#ffffff12}
  main{min-width:0;padding:30px clamp(20px,4.5vw,68px) 48px;max-width:1500px;width:100%;margin-inline:auto;transition:padding-inline var(--panel-motion)}
  .collection-open main{padding-inline:clamp(16px,2.4vw,40px)}
  .toolbar{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:28px}
  .search{display:flex;align-items:center;gap:9px;border:1px solid var(--line);border-radius:10px;padding:8px 12px;width:min(100%,330px);min-width:0;background:#ffffff07;color:var(--muted)}
  .search input{border:0;min-width:0;width:100%;background:none;color:var(--text)}
  .search:focus-within{border-color:var(--accent)}
  .search input:focus-visible{outline:none}
  .icon-btn{display:inline-grid;place-items:center;width:36px;height:36px;border-radius:9px;color:var(--muted);flex:none}
  .refresh{border:1px solid var(--line);width:auto;padding:0 12px;display:inline-flex;gap:8px;align-items:center;font-size:13px}
  .hero{position:relative;isolation:isolate;overflow:hidden;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;min-height:276px;border-radius:20px;border:1px solid #d0b5ff40;padding:clamp(23px,4vw,49px);background:linear-gradient(110deg,#2c1d50 0%,#302054 42%,#32264c 74%,#271c3a 100%)}
  .hero:before{content:"";position:absolute;z-index:-1;inset:-55% -12% -75% 38%;transform:rotate(-23deg);background:repeating-radial-gradient(ellipse at 63% 49%,#151022 0 4px,#312448 5px 7px,#1d142d 8px 12px);border-radius:50%;box-shadow:0 0 55px 5px #b89af671;opacity:.85}
  .hero:after{content:"";position:absolute;z-index:-1;inset:0;background:linear-gradient(90deg,#291b46 4%,#291b46da 31%,transparent 86%)}
  h1,h2,p{margin:0}
  h1{max-width:100%;font-size:clamp(36px,5.2vw,67px);line-height:1.04;letter-spacing:-.055em;overflow-wrap:anywhere}
  h2{font-size:24px;letter-spacing:-.025em}
  .hero p{color:#e1d5fa;margin-top:12px}
  .primary{margin-top:23px;display:inline-flex;align-items:center;gap:8px;background:var(--accent);color:#211436;border-radius:9px;padding:9px 15px;font-weight:730}
  .primary:hover:enabled,.play:hover:enabled{background:#e2d7ff}
  .section-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:27px 0 15px}
  .muted,.notice{color:var(--muted);font-size:14px}
  .notice{margin-top:14px}
  .source-settings{margin-top:14px;color:var(--muted);font-size:14px}
  .source-settings summary{width:fit-content;cursor:pointer}
  .source-settings form{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:8px}
  .source-settings input{width:min(100%,360px);padding:7px 10px;border:1px solid var(--line);border-radius:9px;background:#ffffff07;color:var(--text)}
  .source-settings .primary{margin:0;padding:7px 12px}
  #playback-note{position:fixed;z-index:6;bottom:calc(var(--player-height) + 18px);right:18px;max-width:min(420px,calc(100vw - 36px));padding:12px 15px;border:1px solid var(--line);border-radius:10px;background:var(--bar);color:var(--text)}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(185px,100%),1fr));gap:24px 18px}
  .card{text-align:left;padding:0;min-width:0}
  .card strong,.card small,.track-title,.track-sub,.now strong,.now small{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .card strong{margin-top:9px;font-weight:650}
  .card small,.track-sub,.now small{color:var(--muted);font-size:13px}
  .cover{position:relative;display:grid;place-items:center;aspect-ratio:1;border-radius:12px;overflow:hidden;isolation:isolate;background:radial-gradient(ellipse at 26% 15%,hsl(var(--h) 65% 56%),transparent 64%),linear-gradient(145deg,hsl(var(--h) 46% 29%),#17101e 80%);border:1px solid #ffffff23}
  .cover:before{content:"";position:absolute;width:79%;aspect-ratio:1;border-radius:50%;background:repeating-radial-gradient(circle,#ffffff25 0 1px,transparent 2px 5px);transform:translate(12%,13%);box-shadow:0 0 30px #ffffff29}
  .cover .icon{width:28%;height:28%;color:#fff9;z-index:0}
  .cover img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;background:#272030}
  .card:hover .cover{filter:brightness(1.14)}
  .detail{display:grid;grid-template-columns:minmax(100px,190px) minmax(0,1fr);align-items:end;gap:clamp(13px,3vw,28px);border-bottom:1px solid var(--line);padding:0 0 25px}
  .detail h1{font-size:clamp(26px,4.3vw,58px)}
  .detail p{margin-top:6px;color:var(--muted)}
  .back{color:var(--accent);padding:0;margin-bottom:17px;text-align:left}
  .track{display:grid;grid-template-columns:32px minmax(0,1fr) 23px;gap:12px;align-items:center;text-align:left;width:100%;padding:10px 12px;border-radius:8px;border-bottom:1px solid var(--line)}
  .track[aria-current="true"]{color:var(--accent)}
  .track-index{color:var(--muted);font-size:13px}
  .track .cover{border-radius:5px}
  .track .icon{width:16px;height:16px}
  .player{position:fixed;inset:auto 0 0;z-index:4;background:var(--bar);border-top:1px solid var(--line);display:grid;grid-template-columns:minmax(0,1fr) minmax(248px,1.5fr) minmax(0,1fr);align-items:center;gap:16px;padding:12px clamp(12px,3vw,35px) max(12px,env(safe-area-inset-bottom))}
  .now{display:grid;grid-template-columns:47px minmax(0,1fr);align-items:center;gap:11px;min-width:0}
  .now .cover{border-radius:7px}
  .transport{display:flex;align-items:center;justify-content:center;gap:5px}
  .transport .play{display:grid;place-items:center;width:37px;height:37px;border-radius:50%;background:var(--accent);color:#251737}
  [aria-pressed="true"]{color:var(--accent);background:#cbbaff1d}
  .timeline{display:grid;grid-template-columns:36px 1fr 36px;align-items:center;gap:8px;color:var(--muted);font-size:11px;font-variant-numeric:tabular-nums;text-align:center;margin-top:4px}
  input[type="range"]{width:100%;min-width:0;margin:0;accent-color:var(--accent);cursor:pointer}
  .volume{display:flex;align-items:center;justify-content:end;gap:6px}
  .volume input{max-width:95px}
  .volume .lyrics-toggle{margin-left:8px}
  .lyrics-panel{position:fixed;z-index:5;inset:16px 16px calc(var(--player-height) + 12px) auto;width:min(430px,calc(100vw - 32px));display:flex;flex-direction:column;background:linear-gradient(160deg,#31234d,#171421 54%);border:1px solid #ffffff2c;border-radius:17px;box-shadow:0 15px 54px #0009}
  #collection-panel{width:var(--collection-width);right:var(--panel-gap);overflow:hidden;visibility:hidden;opacity:0;transform:translateX(12px);pointer-events:none;transition:transform var(--panel-motion),opacity var(--panel-motion),visibility var(--panel-motion);box-shadow:none}
  .collection-open #collection-panel{visibility:visible;opacity:1;transform:none;pointer-events:auto}
  .lyrics-header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 20px;border-bottom:1px solid var(--line)}
  .lyrics-header>div{min-width:0}.lyrics-header h2{font-size:19px}.lyrics-header p{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lyrics-scroll{min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 24px;scrollbar-width:thin}
  .lyrics-scroll.synced{padding-block:clamp(24px,18vh,180px)}
  .lyric-line{display:block;width:100%;margin:0 0 8px;padding:6px 0;text-align:left;color:#b4a6ce;font-size:clamp(21px,3.2vw,30px);font-weight:720;line-height:1.23;overflow-wrap:anywhere;transition:color .22s ease,transform .22s ease;transform-origin:left}
  .lyric-line:hover,.lyric-line:focus-visible{color:#fff}
  .lyric-line[aria-current="true"]{color:#fff;transform:scale(1.02)}
  .lyric-line[aria-current="true"]>span{color:transparent;background:linear-gradient(90deg,#fff 0 var(--fill,0%),#ae98da var(--fill,0%) 100%);background-clip:text;-webkit-background-clip:text}
  .plain-lyrics{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px 0 22px;color:#f2eaff;font-size:17px}
  .lyrics-status{padding:22px 0;color:var(--muted)}
  .lyrics-credit{margin-top:auto;padding:9px 20px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
  .track-row{display:grid;grid-template-columns:minmax(0,1fr) 36px;gap:4px;align-items:center}
  .track-tools{color:var(--muted)}
  .collection-controls{display:flex;gap:8px;padding:13px 16px 0}
  .collection-controls button,.song-actions button{border:1px solid var(--line);border-radius:8px;padding:7px 11px}
  .collection-controls button[aria-pressed=true]{border-color:#cbbaff61}
  .music-pane{overflow:auto;min-height:0;padding:14px 16px 18px;overscroll-behavior:contain;scrollbar-width:thin}
  .playlist-form{display:flex;flex-wrap:wrap;gap:7px;margin:9px 0}
  .playlist-form input,.music-pane select,.song-actions select{font:inherit;color:var(--text);background:#201b30;border:1px solid #ffffff34;border-radius:8px;padding:7px 9px;min-width:0}
  .playlist-form input{flex:1}
  .playlist-picker{display:flex;align-items:center;gap:8px}
  .playlist-picker select{flex:1;width:0}
  .collection-button{padding:7px 10px;border-radius:8px;background:#cbbaff1d;color:var(--accent);font-size:13px}
  .collection-button:hover:enabled{background:#cbbaff39}
  .playlist-items{list-style:none;padding:0;margin:8px 0 0}
  .playlist-item{display:flex;align-items:center;gap:2px;border-bottom:1px solid var(--line);border-radius:8px}
  .playlist-item.drop-before{box-shadow:inset 0 2px var(--accent)}
  .playlist-item.drop-after{box-shadow:inset 0 -2px var(--accent)}
  .playlist-item.dragging{opacity:.5}
  .playlist-item .icon-btn{width:29px;height:34px}
  .playlist-item .icon{width:16px;height:16px}
  .playlist-item .grab{cursor:grab;display:grid;place-items:center;color:var(--muted);width:24px;min-height:39px;flex:none;touch-action:none;user-select:none}
  .playlist-song{text-align:left;flex:1;min-width:0;padding:8px 4px}
  .playlist-song:hover:enabled{color:var(--accent)}
  .playlist-song[aria-current=true]{color:var(--accent)}
  .playlist-summary{margin:10px 0;color:var(--muted);font-size:13px}
  .song-actions{color:var(--text);background:#211b31;border:1px solid #ffffff34;border-radius:15px;width:min(360px,calc(100% - 28px));padding:16px}
  .song-actions::backdrop{background:#0b0715a8}
  .song-actions header{display:flex;justify-content:space-between;align-items:flex-start;gap:6px;margin:0 0 10px}
  .song-actions h2{font-size:18px;overflow-wrap:anywhere}
  .song-actions .action-buttons{display:grid;gap:7px}
  .song-actions .action-buttons button{text-align:left}
  .song-actions label{display:grid;gap:5px;color:var(--muted);font-size:13px;margin-top:4px}
  .action-status{position:fixed;bottom:calc(var(--player-height) + 12px);left:18px;z-index:6;padding:8px 12px;background:var(--bar);border:1px solid var(--line);border-radius:8px;max-width:calc(100vw - 36px)}
  .action-status:empty{padding:0;border:0}
  @media (forced-colors:active){.lyric-line[aria-current="true"]>span{color:Highlight;background:none}}
  @media (min-width:901px) and (max-width:1150px){
    .collection-open .refresh span{display:none}
    .collection-open .refresh{padding-inline:9px}
  }
  @media (max-width:900px){
    body{display:grid;height:100dvh;overflow:hidden;grid-template-rows:minmax(0,1fr) 0px auto;transition:grid-template-rows var(--panel-motion)}
    body.collection-open{grid-template-rows:minmax(0,1fr) min(55dvh,max(0px,calc(100dvh - var(--player-height) - 92px))) auto}
    .shell,.collection-open .shell{grid-row:1;grid-template-columns:minmax(0,1fr);min-height:0;padding:0;overflow:auto;align-content:start;overscroll-behavior:contain;transition:none}
    .sidebar{padding:12px 18px;border-right:0;border-bottom:1px solid var(--line)}
    .side-inner{display:flex;align-items:center;justify-content:space-between;gap:9px;position:static}
    .brand{margin:0;padding:0;font-size:19px}.mark{width:29px;height:29px}
    .nav-label{display:none}.side-inner nav{display:flex;gap:5px}.nav-btn{width:auto;padding:7px 8px;gap:5px;font-size:13px}.nav-btn .icon{width:16px;height:16px}
    main,.collection-open main{padding:16px max(14px,env(safe-area-inset-right)) 36px max(14px,env(safe-area-inset-left));transition:none}
    .toolbar{margin-bottom:17px}.hero{min-height:220px}
    .player{position:relative;inset:auto;grid-row:3;grid-template-columns:minmax(0,1fr) auto auto;gap:3px 6px;padding-inline:max(12px,env(safe-area-inset-left)) max(12px,env(safe-area-inset-right))}
    .controls{display:contents}.transport{justify-content:end}.timeline{grid-column:1/-1;grid-row:2}.volume{grid-column:3;grid-row:1;gap:2px}.volume #volume,.volume #mute{display:none}.volume .lyrics-toggle{margin:0}.volume .icon-btn{width:36px}
    .now{grid-template-columns:35px minmax(0,1fr);gap:7px}.now strong{font-size:13px}.now small{font-size:11px}.transport{gap:1px}.transport .icon-btn{width:28px}.transport .icon{width:16px}
    #collection-panel{position:relative;inset:auto;grid-row:2;min-height:0;width:100%;border-radius:16px 16px 0 0;transform:translateY(20px);z-index:2;padding-inline:env(safe-area-inset-left) env(safe-area-inset-right)}
    .collection-open #collection-panel{transform:none}
    #collection-panel .lyrics-header{padding:6px 14px}
    .collection-controls{padding:6px 12px 0}
    .collection-controls button,.collection-button,.song-actions .action-buttons button{min-height:44px}
    .music-pane{padding:8px 12px 12px}
    .playlist-form input{width:0}
    .playlist-item .icon-btn,.playlist-item .grab{width:38px;height:44px}
    .playlist-song{min-height:44px}
  }
  @media (max-width:500px){
    .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:17px 12px}
    #refresh span{display:none}
    .refresh{min-height:44px}
    .hero:before{left:26%;opacity:.55}
    .track-row{grid-template-columns:minmax(0,1fr) 44px}
    .track-row>.icon-btn{width:44px;height:44px}
    .track{grid-template-columns:22px minmax(0,1fr) 18px;gap:7px;padding-inline:8px}
  }
  @media (max-width:500px) and (min-height:480px){
    .player{grid-template-columns:minmax(0,1fr) auto;padding-block:3px max(6px,env(safe-area-inset-bottom))}
    .transport{grid-column:1/-1;grid-row:2;justify-content:center}
    .transport .icon-btn,.transport .play,.volume .icon-btn{width:44px;height:44px}
    .timeline{grid-row:3;margin-top:0}
    .volume{grid-column:2;grid-row:1}
  }
  @media (prefers-reduced-motion:reduce){
    body,.shell,main,#collection-panel,.lyric-line{transition:none}
    .lyric-line[aria-current="true"]{transform:none}
  }
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="side-inner">
      <div class="brand"><span class="mark" data-icon="music"></span>26music</div>
      <nav aria-label="Library">
        <p class="nav-label">Library</p>
        <button class="nav-btn" id="albums-nav" aria-current="page"><span data-icon="albums"></span>Albums</button>
        <button class="nav-btn" id="songs-nav"><span data-icon="music"></span>Songs</button>
      </nav>
    </div>
  </aside>
  <main>
    <div class="toolbar">
      <label class="search"><span data-icon="search"></span><input id="search" type="search" placeholder="Search albums or songs" aria-label="Search albums or songs"></label>
      <button id="refresh" class="icon-btn refresh" aria-label="Refresh library" title="Refresh library"><i data-icon="refresh"></i><span>Refresh</span></button>
    </div>
    <section class="hero" id="hero">
      <h1>Music Library</h1>
      <p id="total">Finding albums…</p>
      <button class="primary" id="shuffle-all" disabled><span data-icon="shuffle"></span>Shuffle All</button>
    </section>
    <p class="notice" id="notice" role="status" hidden></p>
    <details class="source-settings" id="source-settings">
      <summary>Library source</summary>
      <form id="source-form">
        <input id="source-url" aria-label="Public GitHub repository URL" required>
        <button class="primary" type="submit">Load Library</button>
      </form>
    </details>
    <section id="content" aria-label="Music library"></section>
  </main>
</div>
<p id="playback-note" role="status" hidden></p>
<p id="action-status" class="action-status" role="status"></p>
<footer class="player" aria-label="Music player">
  <div class="now"><div id="mini-cover"></div><div><strong id="now-title">Nothing playing</strong><small id="now-album">Choose a song</small></div></div>
  <div class="controls">
    <div class="transport">
      <button class="icon-btn" id="shuffle" data-icon="shuffle" title="Shuffle" aria-label="Shuffle" aria-pressed="false" disabled></button>
      <button class="icon-btn" id="previous" data-icon="previous" title="Previous track" aria-label="Previous track" disabled></button>
      <button class="play" id="play" data-icon="play" title="Play" aria-label="Play" disabled></button>
      <button class="icon-btn" id="next" data-icon="next" title="Next track" aria-label="Next track" disabled></button>
      <button class="icon-btn" id="repeat" data-icon="repeat" title="Repeat off" aria-label="Repeat off" aria-pressed="false" disabled></button>
    </div>
    <div class="timeline"><span id="elapsed">0:00</span><input id="seek" type="range" min="0" max="1" value="0" step="any" aria-label="Playback position" disabled><span id="duration">0:00</span></div>
  </div>
  <div class="volume">
    <button class="icon-btn" id="mute" data-icon="volume" title="Mute" aria-label="Mute" aria-pressed="false"></button>
    <input id="volume" type="range" min="0" max="1" step=".01" value="1" aria-label="Volume">
    <button class="icon-btn lyrics-toggle" id="lyrics-toggle" data-icon="lyrics" title="Lyrics" aria-label="Lyrics" aria-expanded="false" aria-controls="lyrics-panel"></button>
    <button class="icon-btn" id="collection-toggle" data-icon="list" title="Playlists and queue" aria-label="Playlists and queue" aria-expanded="false" aria-controls="collection-panel"></button>
  </div>
  <audio id="audio" preload="metadata"></audio>
</footer>
<aside id="lyrics-panel" class="lyrics-panel" aria-labelledby="lyrics-title" hidden>
  <header class="lyrics-header"><div><h2 id="lyrics-title">Lyrics</h2><p id="lyrics-song"></p></div><button id="lyrics-close" class="icon-btn" data-icon="close" aria-label="Close lyrics" title="Close lyrics"></button></header>
  <div id="lyrics-scroll" class="lyrics-scroll"></div>
  <p id="lyrics-credit" class="lyrics-credit" hidden></p>
</aside>
<aside id="collection-panel" class="lyrics-panel" aria-labelledby="collection-title" aria-hidden="true" inert>
  <header class="lyrics-header"><h2 id="collection-title">Playlists &amp; Queue</h2><button id="collection-close" class="icon-btn" data-icon="close" aria-label="Close playlists and queue"></button></header>
  <div class="collection-controls">
    <button id="playlist-view" aria-pressed="true" aria-controls="playlist-pane">Playlists</button>
    <button id="queue-view" aria-pressed="false" aria-controls="queue-pane">Up Next</button>
  </div>
  <section class="music-pane" id="playlist-pane" aria-label="Playlists">
    <div class="playlist-picker">
      <select id="playlist-select" aria-label="Select playlist"></select>
      <button id="play-playlist" class="collection-button">Play Playlist</button>
    </div>
    <form id="playlist-form" class="playlist-form">
      <input id="playlist-name" maxlength="60" required aria-label="New playlist name" placeholder="New playlist name">
      <button class="collection-button" type="submit">Create</button>
    </form>
    <p class="playlist-summary" id="playlist-summary"></p>

  function showLyrics(result) {
    if (!result || result.instrumental) {
      lyricsMessage(result?.instrumental ? 'Instrumental track' : 'No lyrics found for this song.');
      return;
    }
    const lines = parseLrc(result.syncedLyrics || '');
    if (lines.some(item => item.line)) {
      lyricsScroll.classList.add('synced');
      lyricLines = lines.map(item => {
        const node = item.line ? button('lyric-line', '', () => {
          if (Number.isFinite(audio.duration)) audio.currentTime = Math.min(audio.duration, item.time);
        }) : null;
        const text = element('span', '', item.line);
        if (node) node.append(text);
        return { ...item, node, text };
      });
      lyricsScroll.replaceChildren(...lyricLines.map(item => item.node).filter(Boolean));
      lyricIndex = -1;
      syncLyrics();
    } else if (result.plainLyrics?.trim()) {
      lyricsScroll.replaceChildren(element('p', 'plain-lyrics', result.plainLyrics.trim()));
    } else {
      lyricsMessage('No lyrics found for this song.');
    }
    if (result.source && (lyricLines.length || result.plainLyrics?.trim())) message(lyricsCredit, result.source);
  }
  async function findLyrics(track, duration, signal) {
    const sidecar = lyricsFiles.get(track.path.replace(audioFile, '.lrc').toLowerCase());
    if (sidecar) {
      for (const url of sources(sidecar)) {
        try {
          const response = await fetch(url, { signal: AbortSignal.any([signal, AbortSignal.timeout(2500)]) });
          if (!response.ok) continue;
          const text = await response.text();
          if (parseLrc(text).some(item => item.line)) return { syncedLyrics: text, source: 'Repository lyrics' };
        } catch (error) {
          if (signal.aborted) throw error;
        }
      }
    }
    const queries = [new URLSearchParams({ track_name: track.title })];
    if (track.album.artist) {
      queries.unshift(new URLSearchParams({ track_name: track.title, artist_name: track.album.artist, album_name: track.album.title }));
    }
    const candidates = new Map();
    const expectedTitle = normalized(track.title);
    const expectedArtist = normalized(track.album.artist);
    const expectedAlbum = normalized(track.album.title);
    for (const query of queries) {
      const response = await fetch('https://lrclib.net/api/search?' + query, {
        signal: AbortSignal.any([signal, AbortSignal.timeout(6500)])
      });
      if (!response.ok) throw new Error('Lyrics lookup failed');
      for (const result of await response.json()) {
        if (normalized(result.trackName) !== expectedTitle) continue;
        const difference = Math.abs(result.duration - duration);
        if (!Number.isFinite(difference) || difference > 6) continue;
        const artist = normalized(result.artistName);
        const artistMatches = Boolean(expectedArtist && artist === expectedArtist);
        if (expectedArtist && !artistMatches && difference > 2) continue;
        if (!expectedArtist && difference > 3) continue;
        const albumMatches = normalized(result.albumName) === expectedAlbum;
        const score = 24 * artistMatches + 12 * albumMatches + 7 * Boolean(result.syncedLyrics) - difference;
        candidates.set(result.id, { score, result });
      }
      if ([...candidates.values()].some(item => item.score >= 36 && item.result.syncedLyrics)) break;
    }
    const ranked = [...candidates.values()].sort((left, right) => right.score - left.score);
    if (ranked.length > 1 && ranked[0].score - ranked[1].score < 2 &&
        normalized(ranked[0].result.artistName) !== normalized(ranked[1].result.artistName)) return null;
    return ranked[0] ? { ...ranked[0].result, source: 'Lyrics from LRCLIB' } : null;
  }
  function updateLyrics() {
    const track = current();
    if (lyricsPanel.hidden || !track || lyricsTrack === track.path || !Number.isFinite(audio.duration)) return;
    lyricsTrack = track.path;
    if (lyricsCache.has(track.path)) {
      showLyrics(lyricsCache.get(track.path));
      return;
    }
    lyricsJob = new AbortController();
    const { signal } = lyricsJob;
    findLyrics(track, audio.duration, signal).then(result => {
      if (signal.aborted) return;
      lyricsCache.set(track.path, result);
      showLyrics(result);
    }).catch(() => {
      if (!signal.aborted) lyricsMessage('Lyrics could not be loaded. Reopen the panel to retry.');
    });
  }
  function resetLyrics() {
    lyricsJob?.abort();
    lyricsTrack = null;
    const track = current();
    byId('lyrics-song').textContent = track?.title || '';
    lyricsMessage(track ? 'Finding lyrics…' : 'Play a song to see its lyrics.');
    updateLyrics();
  }
  function syncLyrics() {
    if (!lyricLines.length || lyricsPanel.hidden) return;
    const time = audio.currentTime;
    let low = 0, high = lyricLines.length;
    while (low < high) {
      const middle = (low + high) >>> 1;
      if (lyricLines[middle].time <= time) low = middle + 1;
      else high = middle;
    }
    const index = low - 1;
    const active = lyricLines[index];
    if (index !== lyricIndex) {
      lyricLines[lyricIndex]?.node?.removeAttribute('aria-current');
      lyricIndex = index;
      if (active?.node) {
        active.node.setAttribute('aria-current', 'true');
        const lineTop = active.node.getBoundingClientRect().top - lyricsScroll.getBoundingClientRect().top + lyricsScroll.scrollTop;
        lyricsScroll.scrollTo({ top: lineTop - lyricsScroll.clientHeight * .34, behavior: reducedMotion.matches ? 'auto' : 'smooth' });
      } else if (index < 0) {
        lyricsScroll.scrollTo({ top: 0, behavior: reducedMotion.matches ? 'auto' : 'smooth' });
      }
    }
    if (active?.node) {
      const end = lyricLines[index + 1]?.time || Math.min(audio.duration || Infinity, active.time + 8);
      const fill = Math.min(1, Math.max(0, (time - active.time) / Math.max(.1, end - active.time)));
      active.text.style.setProperty('--fill', `${fill * 100}%`);
    }
  }
  function animateLyrics() {
    syncLyrics();
    if (!audio.paused && !lyricsPanel.hidden) lyricFrame = requestAnimationFrame(animateLyrics);
    else lyricFrame = 0;
  }
  function setLyricsOpen(open) {
    if (open && !collectionPanel.inert) setCollectionOpen(false);
    lyricsPanel.hidden = !open;
    byId('lyrics-toggle').setAttribute('aria-expanded', String(open));
    byId('lyrics-toggle').setAttribute('aria-pressed', String(open));
    if (open) {
      resetLyrics();
      if (!lyricFrame) animateLyrics();
      byId('lyrics-close').focus();
    } else {
      lyricsJob?.abort();
      cancelAnimationFrame(lyricFrame);
      lyricFrame = 0;
      byId('lyrics-toggle').focus();
    }
  }
  byId('lyrics-toggle').addEventListener('click', () => setLyricsOpen(lyricsPanel.hidden));
  byId('lyrics-close').addEventListener('click', () => setLyricsOpen(false));
  document.addEventListener('keydown', event => {
    if (event.key !== 'Escape' || songActions.open) return;
    if (!lyricsPanel.hidden) setLyricsOpen(false);
    if (!collectionPanel.inert) setCollectionOpen(false);
  });
  const collectionPanel = byId('collection-panel');
  const playlistItems = byId('playlist-items');
  const playlistSelect = byId('playlist-select');
  const songActions = byId('song-actions');
  const songPlaylists = byId('song-playlists');
  const playlistKey = `ymusic/playlists/${repoSlug.toLowerCase()}/1`;
  let playlists = [{ name: 'My Playlist', paths: [] }];
  let playlistIndex = 0, actionTrack = null, statusTimer;
  try {
    const saved = JSON.parse(localStorage.getItem(playlistKey));
    if (Array.isArray(saved?.playlists) && saved.playlists.length && saved.playlists.every(item =>
      typeof item?.name === 'string' && Array.isArray(item.paths) && item.paths.every(path => typeof path === 'string'))) {
      playlists = saved.playlists;
      if (Number.isInteger(saved.index) && playlists[saved.index]) playlistIndex = saved.index;
    }
  } catch {}
  function savePlaylists() {
    try {
      localStorage.setItem(playlistKey, JSON.stringify({ index: playlistIndex, playlists }));
    } catch {
      announce('Changes are available for this session. Browser storage is unavailable.');
    }
  }
  function announce(text) {
    const status = byId('action-status');
    clearTimeout(statusTimer);
    status.textContent = text;
    statusTimer = setTimeout(() => { status.textContent = ''; }, 3200);
  }
  function fillPlaylistOptions(select) {
    select.replaceChildren(...playlists.map((playlist, index) => {
      const option = element('option', '', playlist.name);
      option.value = String(index);
      return option;
    }));
    select.value = String(playlistIndex);
  }
  function setCollectionOpen(open) {
    if (open && !lyricsPanel.hidden) setLyricsOpen(false);
    document.body.classList.toggle('collection-open', open);
    collectionPanel.inert = !open;
    collectionPanel.setAttribute('aria-hidden', String(!open));
    byId('collection-toggle').setAttribute('aria-expanded', String(open));
    byId('collection-toggle').setAttribute('aria-pressed', String(open));
    if (open) {
      renderPlaylist();
      renderQueue();
      byId('collection-close').focus({ preventScroll: true });
    } else byId('collection-toggle').focus({ preventScroll: true });
  }
  function showCollectionPane(queueVisible) {
    byId('playlist-pane').hidden = queueVisible;
    byId('queue-pane').hidden = !queueVisible;
    byId('playlist-view').setAttribute('aria-pressed', String(!queueVisible));
    byId('queue-view').setAttribute('aria-pressed', String(queueVisible));
    if (queueVisible) renderQueue();
  }
  function openSongActions(track) {
    actionTrack = track;
    byId('song-actions-title').textContent = track.title;
    fillPlaylistOptions(songPlaylists);
    songActions.showModal();
  }
  function enqueue(track, next) {
    const entry = { ...track, queuedManually: true };
    if (next) queue.splice(position + 1, 0, entry);
    else queue.push(entry);
    updatePlayer();
    renderQueue();
  }
  function queueSong(next) {
    if (!actionTrack) return;
    enqueue(actionTrack, next);
    songActions.close();
    announce(next ? 'Song will play next.' : 'Song added to the end of the queue.');
  }
  function addToPlaylist() {
    const playlist = playlists[Number(songPlaylists.value)];
    if (!playlist || !actionTrack) return;
    const exists = playlist.paths.includes(actionTrack.path);
    songActions.close();
    if (exists) {
      announce(`Already in ${playlist.name}.`);
      return;
    }
    playlist.paths.push(actionTrack.path);
    announce(`Added to ${playlist.name}.`);
    savePlaylists();
    renderPlaylist();
  }
  function playlistTracks() {
    const tracks = new Map(allTracks.map(track => [track.path, track]));
    return playlists[playlistIndex].paths.map(path => ({ path, track: tracks.get(path) }));
  }
  function playPlaylist(path) {
    const tracks = playlistTracks().map(item => item.track).filter(Boolean);
    if (!tracks.length) return;
    const index = path ? tracks.findIndex(track => track.path === path) : 0;
    if (index < 0) return;
    shuffled = false;
    start(tracks, index);
  }
  function movePlaylistSong(from, to) {
    const paths = playlists[playlistIndex].paths;
    if (from === to || to < 0 || to >= paths.length) return;
    paths.splice(to, 0, paths.splice(from, 1)[0]);
    announce(`Moved to position ${to + 1}.`);
    savePlaylists();
    renderPlaylist();
  }
  function makeDragHandle(row, from) {
    const handle = element('span', 'grab');
    handle.innerHTML = icon('drag');
    handle.title = 'Drag to reorder';
    handle.setAttribute('aria-hidden', 'true');
    let pointer, target, after = false;
    function resetTarget() {
      target?.classList.remove('drop-before', 'drop-after');
      target = null;
    }
    handle.addEventListener('pointerdown', event => {
      if (event.button !== 0 || pointer !== undefined) return;
      pointer = event.pointerId;
      handle.setPointerCapture(pointer);
      row.classList.add('dragging');
    });
    handle.addEventListener('pointermove', event => {
      if (event.pointerId !== pointer) return;
      resetTarget();
      const pane = byId('playlist-pane');
      const bounds = pane.getBoundingClientRect();
      if (event.clientY < bounds.top + 38) pane.scrollTop -= 14;
      else if (event.clientY > bounds.bottom - 38) pane.scrollTop += 14;
      const candidate = document.elementFromPoint(event.clientX, event.clientY)?.closest('[data-playlist-position]');
      if (!candidate || candidate === row || !playlistItems.contains(candidate)) return;
      target = candidate;
      const rect = candidate.getBoundingClientRect();
      after = event.clientY > rect.top + rect.height / 2;
      target.classList.add(after ? 'drop-after' : 'drop-before');
    });
    function finish(event) {
      if (event.pointerId !== pointer) return;
      const index = target ? Number(target.dataset.playlistPosition) : -1;
      resetTarget();
      pointer = undefined;
      row.classList.remove('dragging');
      if (event.type === 'pointerup' && index >= 0) {
        const insertion = index + Number(after);
        movePlaylistSong(from, insertion - (insertion > from ? 1 : 0));
      }
    }
    for (const event of ['pointerup', 'pointercancel', 'lostpointercapture']) handle.addEventListener(event, finish);
    return handle;
  }
  function renderPlaylist() {
    fillPlaylistOptions(playlistSelect);
    const entries = playlistTracks();
    byId('play-playlist').disabled = !entries.some(item => item.track);
    byId('playlist-summary').textContent = entries.length
      ? `${countText(entries.length, 'song')} · Drag to reorder`
      : 'Use the song actions to add songs to this playlist.';
    playlistItems.replaceChildren();
    for (const [index, { path, track }] of entries.entries()) {
      const row = element('li', 'playlist-item');
      row.dataset.playlistPosition = index;
      const title = track?.title || path.split('/').at(-1);
      const play = button('playlist-song', '', () => playPlaylist(path));
      play.disabled = !track;
      play.append(element('strong', 'track-title', title), element('small', 'track-sub', track ? track.album.title : 'Unavailable'));
      const move = (delta, side) => {
        movePlaylistSong(index, index + delta);
        const nextRow = playlistItems.children[index + delta];
        const nextButton = nextRow.querySelector(`[data-move="${side}"]`);
        if (nextButton.disabled) nextRow.querySelector('button:not(:disabled)')?.focus();
        else nextButton.focus();
      };
      const up = iconButton(`Move ${title} up`, 'up', () => move(-1, 'up'));
      const down = iconButton(`Move ${title} down`, 'down', () => move(1, 'down'));
      up.dataset.move = 'up';
      down.dataset.move = 'down';
      up.disabled = index === 0;
      down.disabled = index === entries.length - 1;
      row.append(makeDragHandle(row, index), play, up, down,
        iconButton(`Remove ${title} from playlist`, 'close', () => {
          playlists[playlistIndex].paths.splice(index, 1);
          announce('Song removed from playlist.');
          savePlaylists();
          renderPlaylist();
          playlistSelect.focus();
        }));
      playlistItems.append(row);
    }
  }
  function renderQueue() {
    const upcoming = queue.slice(position + 1);
    const playing = current();
    byId('queue-summary').textContent = playing
      ? `Current song: ${playing.title} · ${countText(upcoming.length, 'song')} up next`
      : upcoming.length ? `${countText(upcoming.length, 'song')} in the queue` : 'Your queue is empty.';
    const list = byId('queue-items');
    list.replaceChildren();
    for (const [index, track] of upcoming.entries()) {
      const row = element('li', 'playlist-item');
      const absoluteIndex = position + index + 1;
      const play = button('playlist-song', '', () => playAt(absoluteIndex));
      play.append(element('strong', 'track-title', track.title), element('small', 'track-sub', track.album.title));
      row.append(play, iconButton(`Remove ${track.title} from queue`, 'close', () => {
        queue.splice(absoluteIndex, 1);
        updatePlayer();
        renderQueue();
        byId('queue-view').focus();
        announce('Song removed from queue.');
      }));
      list.append(row);
    }
  }
  byId('collection-toggle').addEventListener('click', () => setCollectionOpen(collectionPanel.inert));
  byId('collection-close').addEventListener('click', () => setCollectionOpen(false));
  byId('playlist-view').addEventListener('click', () => showCollectionPane(false));
  byId('queue-view').addEventListener('click', () => showCollectionPane(true));
  byId('song-next').addEventListener('click', () => queueSong(true));
  byId('song-queue').addEventListener('click', () => queueSong(false));
  byId('song-save').addEventListener('click', addToPlaylist);
  byId('play-playlist').addEventListener('click', () => playPlaylist());
  playlistSelect.addEventListener('change', () => {
    playlistIndex = Number(playlistSelect.value);
    savePlaylists();
    renderPlaylist();
  });
  const playlistName = byId('playlist-name');
  playlistName.addEventListener('input', () => playlistName.setCustomValidity(''));
  byId('playlist-form').addEventListener('submit', event => {
    event.preventDefault();
    const name = playlistName.value.trim();
    if (!name || playlists.some(item => item.name.toLocaleLowerCase() === name.toLocaleLowerCase())) {
      playlistName.setCustomValidity(name ? 'This playlist name already exists.' : 'Enter a playlist name.');
      playlistName.reportValidity();
      return;
    }
    playlists.push({ name, paths: [] });
    playlistIndex = playlists.length - 1;
    playlistName.value = '';
    announce(`Created ${name}.`);
    savePlaylists();
    renderPlaylist();
  });
  audio.addEventListener('loadedmetadata', updateLyrics);
  audio.addEventListener('playing', () => {
    if (!lyricFrame && !lyricsPanel.hidden) animateLyrics();
  });
  byId('shuffle-all').addEventListener('click', () => {
    shuffled = true;
    start(allTracks, Math.floor(Math.random() * allTracks.length));
  });
  byId('albums-nav').addEventListener('click', () => navigate('albums'));
  byId('songs-nav').addEventListener('click', () => navigate('songs'));
  byId('refresh').addEventListener('click', refreshLibrary);
  const sourceInput = byId('source-url');
  sourceInput.value = repoURL;
  sourceInput.addEventListener('input', () => sourceInput.setCustomValidity(''));
  byId('source-form').addEventListener('submit', event => {
    event.preventDefault();
    const target = parseRepository(sourceInput.value);
    if (!target) {
      sourceInput.setCustomValidity('Enter a GitHub repository URL, such as https://github.com/owner/repository.');
      sourceInput.reportValidity();
      return;
    }
    if (`${target.owner}/${target.name}`.toLowerCase() === repoSlug.toLowerCase()) {
      if (!byId('refresh').disabled) refreshLibrary();
      return;
    }
    const url = new URL(location.href);
    url.searchParams.set('repo', `${target.owner}/${target.name}`);
    location.assign(url.href);
  });
  search.addEventListener('input', render);
  byId('play').addEventListener('click', togglePlay);
  byId('previous').addEventListener('click', () => step(-1));
  byId('next').addEventListener('click', () => step(1));
  byId('shuffle').addEventListener('click', toggleShuffle);
  byId('repeat').addEventListener('click', () => { repeat = (repeat + 1) % 3; updatePlayer(); });
  byId('seek').addEventListener('input', event => {
    if (Number.isFinite(audio.duration)) audio.currentTime = Number(event.target.value);
  });
  byId('volume').addEventListener('input', event => {
    audio.volume = Number(event.target.value);
    audio.muted = false;
  });
  byId('mute').addEventListener('click', () => {
    if (audio.volume === 0) { audio.volume = 1; audio.muted = false; }
    else audio.muted = !audio.muted;
  });
  audio.addEventListener('volumechange', updateVolume);
  audio.addEventListener('error', loadSource);
  audio.addEventListener('ended', () => { step(1, true); updatePlayer(); });
  audio.addEventListener('playing', () => message(playerNote, ''));
  for (const event of ['timeupdate', 'durationchange', 'loadedmetadata', 'emptied']) audio.addEventListener(event, updateTimeline);
  for (const event of ['play', 'pause']) audio.addEventListener(event, updatePlayer);
  const playerBar = document.querySelector('.player');
  if (typeof ResizeObserver === 'function') {
    new ResizeObserver(() => {
      document.body.style.setProperty('--player-height', `${playerBar.offsetHeight}px`);
    }).observe(playerBar);
  }
  byId('mini-cover').append(cover());
  resetLyrics();
  try {
    const cached = JSON.parse(localStorage.getItem(cacheKey));
    if (typeof cached?.branch === 'string' && Array.isArray(cached.paths) && cached.paths.every(path => typeof path === 'string')) {
      repo.branch = cached.branch;
      setCatalog(cached.paths);
    }
  } catch {}
  refreshLibrary();
</script>
