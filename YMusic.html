<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark">
  <title>YMusic — Album Player</title>
  <style>
    :root {
      font-family: "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
      color: #f5f2ed;
      background: #101116;
      --muted: #bcb8b5;
      --border: #34323d;
      --accent: #ffd199;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: radial-gradient(ellipse at 12% 0%, #302333, transparent 48%);
    }
    main { width: min(1060px, 100% - 2rem); margin: auto; padding: 3rem 0; }
    h1, h2, p { margin: 0; }
    h1 { font-family: Georgia, serif; font-size: clamp(2.5rem, 8vw, 4.5rem); line-height: 1; }
    h2 { font-size: 1.1rem; }
    button { font: inherit; color: inherit; cursor: pointer; }
    button:disabled { opacity: .45; cursor: default; }
    button:focus-visible, audio:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
    .muted { color: var(--muted); font-size: .875rem; }
    header p { margin-top: .65rem; }
    .albums { display: flex; flex-wrap: wrap; gap: .75rem; margin: 1.75rem 0; }
    .album {
      display: flex; align-items: center; gap: .65rem; text-align: left;
      padding: .45rem .9rem .45rem .45rem; border: 1px solid var(--border);
      background: #201d27; border-radius: .8rem;
    }
    .album:hover, .album[aria-pressed="true"] { border-color: var(--accent); }
    .album img { width: 42px; height: 42px; border-radius: .45rem; object-fit: cover; }
    .album strong, .album small { display: block; }
    .layout { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 3fr); gap: 1.25rem; align-items: start; }
    .panel { background: #1b1b24; border: 1px solid var(--border); border-radius: 1.25rem; padding: 1.1rem; min-width: 0; }
    .cover {
      width: 100%; aspect-ratio: 1; object-fit: cover; display: block;
      border-radius: .8rem; background: #302839; margin-bottom: 1.1rem;
    }
    #now-playing { font-size: 1.45rem; overflow-wrap: anywhere; margin: .25rem 0 .35rem; }
    audio { display: block; width: 100%; margin-top: 1rem; }
    .transport { display: flex; gap: .65rem; margin-top: .85rem; }
    .transport button {
      flex: 1; padding: .5rem .35rem; background: #262531;
      border: 1px solid var(--border); border-radius: .5rem;
    }
    .transport button:hover:enabled { border-color: var(--accent); }
    #message { color: var(--accent); margin-top: .65rem; }
    #message:empty { margin: 0; }
    .queue-heading { display: flex; justify-content: space-between; align-items: baseline; gap: .5rem; margin: .15rem .4rem .85rem; }
    .queue { list-style: none; padding: 0; margin: 0; }
    .queue li + li { border-top: 1px solid var(--border); }
    .track {
      width: 100%; min-height: 3rem; display: grid; grid-template-columns: 2rem 1fr auto;
      gap: .25rem; align-items: center; text-align: left; padding: .45rem .55rem;
      background: transparent; border: 0; border-radius: .45rem;
    }
    .track:hover { background: #282632; }
    .track[aria-current="true"] { background: #342a35; color: var(--accent); }
    .track-title { overflow-wrap: anywhere; }
    .track-number { font-variant-numeric: tabular-nums; }
    @media (max-width: 690px) {
      main { padding: 2rem 0; }
      .layout { grid-template-columns: 1fr; }
      .cover { max-width: 260px; margin-inline: auto; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>YMusic</h1>
      <p class="muted" id="collection-count"></p>
    </header>
    <nav class="albums" id="albums" aria-label="Albums"></nav>
    <div class="layout">
      <section class="panel" aria-labelledby="now-playing">
        <img class="cover" id="cover" alt="">
        <p class="muted" id="now-label">Selected track</p>
        <h2 id="now-playing" aria-live="polite"></h2>
        <p class="muted" id="now-album"></p>
        <audio id="audio" controls preload="metadata" aria-label="Track playback"></audio>
        <div class="transport">
          <button id="previous" type="button">Previous</button>
          <button id="next" type="button">Next</button>
        </div>
        <p class="muted" id="message" role="status"></p>
      </section>
      <section class="panel" aria-labelledby="queue-title">
        <div class="queue-heading">
          <h2 id="queue-title">Track list</h2>
          <p class="muted" id="track-count"></p>
        </div>
        <ol class="queue" id="queue"></ol>
      </section>
    </div>
    <noscript>Enable JavaScript to select albums and tracks.</noscript>
  </main>
  <script id="catalog" type="application/json">
[

    ]
  },
  {
    "name": "艾尔 EL",
    "cover": "Folder.jpg",
    "tracks": [
      "一半一半.mp3",
      "一路向北 (搖滾版).mp3",
      "七里香 (搖滾版).mp3",
      "不能说的秘密 (搖滾版).mp3",

      "很久以前.mp3",
      "後來 - 搖滾版 (Cover).mp3",
      "心牆 (搖滾版).mp3",
      "愛笑的眼睛 - 搖滾版.mp3",
      "愛錯 (搖滾版).mp3",
      "我不配 (搖滾版).mp3",

      "我落淚 情緒零碎 (摇滚版).mp3",
      "擱淺 (搖滾版).mp3",
      "星語心願.mp3",
      "晴天 (搖滾版).mp3",
      "楓 (搖滾版).mp3",
      "海 • 別離.mp3",
      "煎熬 - 搖滾版.mp3",
      "當你 (搖滾版).mp3",
      "空白.mp3",
      "簡單愛 (搖滾版).mp3",
      "簡單的愛.mp3",
      "紅色高跟鞋 (搖滾版).mp3",
      "至少還有你 (搖滾版).mp3",
      "花海 (搖滾版).mp3",
      "蒲公英的約定 (搖滾版).mp3",
      "說好的幸福呢 (搖滾版).mp3",
      "軌跡 - 搖滾版.mp3",
      "還沒長大.mp3",
      "那一天.mp3",
      "那麼驕傲 (摇滚版).mp3",
      "開不了口 (搖滾版).mp3",
      "黑夜風暴.mp3",
      "龍捲風 (搖滾版).mp3"
    ]
  }
]
  </script>
  <script>
    const albums = JSON.parse(document.getElementById("catalog").textContent);
    const audio = document.getElementById("audio");
    const queue = document.getElementById("queue");
    const previous = document.getElementById("previous");
    const next = document.getElementById("next");
    const message = document.getElementById("message");
    const nowLabel = document.getElementById("now-label");
    let albumIndex = 0;
    let trackIndex = 0;
    let trackButtons = [];

    function assetUrl(album, filename) {
      return [album.name, filename].map(encodeURIComponent).join("/");
    }

    function trackTitle(filename) {
      return filename.replace(/\.mp3$/i, "");
    }

    const albumButtons = albums.map((album, index) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "album";
      const art = document.createElement("img");
      art.alt = "";
      art.src = assetUrl(album, album.cover);
      const label = document.createElement("span");
      const name = document.createElement("strong");
      name.textContent = album.name;
      const count = document.createElement("small");
      count.className = "muted";
      count.textContent = `${album.tracks.length} tracks`;
      label.append(name, count);
      button.append(art, label);
      button.addEventListener("click", () => {
        if (albumIndex !== index) selectAlbum(index);
      });
      document.getElementById("albums").append(button);
      return button;
    });

    function selectAlbum(index) {
      albumIndex = index;
      const album = albums[index];
      albumButtons.forEach((button, i) => button.setAttribute("aria-pressed", i === index));
      document.getElementById("cover").src = assetUrl(album, album.cover);
      document.getElementById("now-album").textContent = album.name;
      document.getElementById("track-count").textContent = `${album.tracks.length} tracks`;
      queue.replaceChildren();
      trackButtons = album.tracks.map((filename, i) => {
        const item = document.createElement("li");
        const button = document.createElement("button");
        button.className = "track";
        button.type = "button";
        const number = document.createElement("span");
        number.className = "track-number muted";
        number.setAttribute("aria-hidden", "true");
        number.textContent = String(i + 1).padStart(2, "0");
        const title = document.createElement("span");
        title.className = "track-title";
        title.textContent = trackTitle(filename);
        const icon = document.createElement("span");
        icon.setAttribute("aria-hidden", "true");
        icon.textContent = "▶";
        button.append(number, title, icon);
        button.addEventListener("click", () => {
          if (trackIndex === i && !audio.paused && !audio.ended) audio.pause();
          else selectTrack(i, true);
        });
        item.append(button);
        queue.append(item);
        return { button, icon };
      });
      selectTrack(0, false);
    }

    function updatePlaybackDisplay() {
      const playing = !audio.paused && !audio.ended;
      nowLabel.textContent = playing ? "Now playing" : "Selected track";
      trackButtons.forEach(({ button, icon }, i) => {
        button.setAttribute("aria-current", i === trackIndex);
        icon.textContent = i === trackIndex && playing ? "Ⅱ" : "▶";
      });
    }

    function selectTrack(index, play) {
      const album = albums[albumIndex];
      const filename = album.tracks[index];
      const source = new URL(assetUrl(album, filename), document.baseURI).href;
      trackIndex = index;
      message.textContent = "";
      if (audio.src !== source) {
        audio.pause();
        audio.src = source;
      }
      document.getElementById("now-playing").textContent = trackTitle(filename);
      previous.disabled = index === 0;
      next.disabled = index === album.tracks.length - 1;
      updatePlaybackDisplay();
      if (play) {
        audio.play().catch(error => {
          if (audio.src === source && error.name !== "AbortError" && !audio.error) {
            message.textContent = "Playback could not start. Use the audio controls to try again.";
          }
        });
      }
    }

    previous.addEventListener("click", () => selectTrack(trackIndex - 1, !audio.paused));
    next.addEventListener("click", () => selectTrack(trackIndex + 1, !audio.paused));
    audio.addEventListener("play", updatePlaybackDisplay);
    audio.addEventListener("pause", updatePlaybackDisplay);
    audio.addEventListener("ended", () => {
      if (!next.disabled) selectTrack(trackIndex + 1, true);
      else updatePlaybackDisplay();
    });
    audio.addEventListener("error", () => {
      message.textContent = "This track could not load. Check that the album folder and audio file are beside this page.";
      updatePlaybackDisplay();
    });
    const total = albums.reduce((count, album) => count + album.tracks.length, 0);
    document.getElementById("collection-count").textContent = `${albums.length} albums · ${total} tracks`;
    selectAlbum(0);
  </script>
</body>
</html>
